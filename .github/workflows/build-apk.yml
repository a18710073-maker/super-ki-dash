name: Build Super Ki Dash Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unpack Game Project ZIP
        run: unzip -o SuperKiDash_AutoAPK_Godot4.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Godot 4.3 & Android Export Templates
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          wget -q https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q Godot_v4.3-stable_export_templates.tpz -d templates_tmp
          mv templates_tmp/templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Configure Debug Keystore & Godot Settings
        run: |
          KEYSTORE_PATH="$HOME/debug.keystore"
          keytool -genkey -v -keystore "$KEYSTORE_PATH" -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

          SDK_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p ~/.config/godot
          cat <<EOF > ~/.config/godot/editor_settings-4.3.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK_PATH"
          export/android/debug_keystore = "$KEYSTORE_PATH"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Export Signed Android APK
        run: |
          cd SuperKiDash
          mkdir -p builds/android
          godot --headless --import || true
          godot --headless --export-debug "Android" builds/android/SuperKiDash.apk

      - name: Upload SuperKiDash.apk
        uses: actions/upload-artifact@v4
        with:
          name: SuperKiDash-Android-APK
          path: SuperKiDash/builds/android/SuperKiDash.apk
